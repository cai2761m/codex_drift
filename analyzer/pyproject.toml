[project]
name = "codex-drift-analyzer"
version = "0.1.0"
description = "Evidence-based model metadata and capability regression analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "opentelemetry-api>=1.31,<2", "opentelemetry-sdk>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "opentelemetry-instrumentation-httpx>=0.52b0,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

