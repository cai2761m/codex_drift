services:
  gateway:
    environment:
      DATABASE_URL: postgres://drift:${POSTGRES_PASSWORD:-drift-local-dev}@postgres:5432/drift
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drift-local-dev}
      POSTGRES_DB: drift
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d drift"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:

