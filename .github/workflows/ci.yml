name: Checks
on: [push, pull_request]
jobs:
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project analyzer --frozen
      - run: uv run ruff check --config pyproject.toml drift tests
        working-directory: analyzer
      - run: uv run pytest -q
        working-directory: analyzer
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: drift_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drift -d drift_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DRIFT_TEST_DATABASE_URL: postgres://drift:test-only@localhost:5432/drift_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo test --locked --manifest-path gateway/Cargo.toml -- --include-ignored
      - run: cargo fmt --manifest-path gateway/Cargo.toml -- --check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
